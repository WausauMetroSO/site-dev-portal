<!doctype html>
<html>
    <head>
        <link href="css/style.css" rel="stylesheet" />
        <meta charset="UTF-8" />
        <title>Login</title>
        <script
            async
            crossorigin="anonymous"
            data-clerk-publishable-key="pk_test_Y2F1c2FsLWRvZy05Mi5jbGVyay5hY2NvdW50cy5kZXYk"
            src="https://causal-dog-92.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
            type="text/javascript"
        ></script>
    </head>
    <body>
        <div id="app" class="h-screen flex items-center justify-center"></div>
        <script>
            window.addEventListener("load", async function () {
                await Clerk.load();
                document.getElementById("app").innerHTML =
                    '<div id="sign-in"></div>';
                Clerk.mountSignIn(document.getElementById("sign-in"));
                Clerk.addListener(({ user }) => {
                    if (user) {
                        window.location.href = "/";
                    }
                });
            });
        </script>
    </body>
</html>
