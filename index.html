<!doctype html>
<html>
    <head>
        <title>Wausau Metro Special Olympics Portal</title>
        <link href="css/style.css" rel="stylesheet" />
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <script
            async
            crossorigin="anonymous"
            data-clerk-publishable-key="pk_test_Y2F1c2FsLWRvZy05Mi5jbGVyay5hY2NvdW50cy5kZXYk"
            src="https://causal-dog-92.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
            type="text/javascript"
        ></script>
    </head>
</html>
<body>
    <header
        class="fixed top-0 left-0 right-0 h-16 flex items-center justify-between px-4 shadow z-30"
    >
        <span class="text-2xl font-semibold"
            >Wausau Metro Special Olympics</span
        >
        <div class="flex w-10 h-10">
            <div id="user-button"></div>
        </div>
    </header>

    <div id="app" class="flex h-screen pt-16">
        <aside class="w-64 flex flex-col">
            <nav class="mt-4 px-2 py-2 flex-1 overflow-auto">
                <ul class="space-y-1">
                    <li>
                        <button
                            class="w-full flex items-center gap-3 px-3 py-2 rounded"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="1.5"
                                stroke="currentColor"
                                class="size-6"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"
                                />
                            </svg>
                            <span>Athlete Roster</span>
                        </button>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="flex-1 p-6 overflow-auto">
            <div class="max-w-full flex flex-col gap-6">
                <div class="card h-44"></div>
                <div class="flex justify-evenly gap-3">
                    <div class="card h-44 flex-1"></div>
                    <div class="card p-4 h-44 flex-1"></div>
                </div>
            </div>
        </main>
    </div>
    <script>
        window.addEventListener("load", async function () {
            await Clerk.load();
            if (Clerk.user) {
                Clerk.mountUserButton(document.getElementById("user-button"));
            } else {
                window.location.href = "/login.html";
                return;
            }
        });
    </script>
</body>
